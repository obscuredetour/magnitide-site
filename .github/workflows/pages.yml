name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The app repo supplies the theme CSS and the icon. While it is private
      # this needs APP_REPO_TOKEN (a fine-grained PAT, Contents: read, on
      # obscuredetour/magnitide); once it is public, drop the token line.
      - uses: actions/checkout@v4
        with:
          repository: obscuredetour/magnitide
          ref: main
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}
      - run: ./build.sh app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
